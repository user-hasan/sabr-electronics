name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Java
        run: java -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive

      # Debug APKs expect Metro to serve index.android.bundle at runtime.
      # Release builds bundle JavaScript into the APK for standalone installs.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabr-electronics-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add APK to workflow summary
        run: |
          echo "## صبر إلكترونكس APK" >> "$GITHUB_STEP_SUMMARY"
          echo "تم بناء ملف APK إصدار مستقل دون Metro. حمّله من Artifacts باسم sabr-electronics-release-apk." >> "$GITHUB_STEP_SUMMARY"
