name: Build Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_VERSION: 22

# Prevent duplicate APK builds from running at the same time.
concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify Java
        run: java -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive

      # Release builds bundle JavaScript into the APK for standalone installs.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabr-electronics-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: صبر إلكترونكس v${{ github.run_number }}
          body: |
            إصدار Android APK جاهز للتثبيت.
            تم إنشاء هذا الإصدار تلقائيًا بواسطة GitHub Actions.
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add APK to workflow summary
        run: |
          echo "## صبر إلكترونكس APK" >> "$GITHUB_STEP_SUMMARY"
          echo "تم بناء ملف APK إصدار مستقل دون Metro." >> "$GITHUB_STEP_SUMMARY"
          echo "تم نشره أيضًا في GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
