name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: 22

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify Java
        run: java -version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabr-electronics-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'version: "[^"]*"' app.config.ts | head -1 | cut -d'"' -f2)
          TAG="v${VERSION}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Saber Electronics ${TAG}" \
            --notes "نسخة عامة مستقلة من Saber Electronics.\n\n- إصلاح الثيم والتباين والاستجابة للشاشات المختلفة.\n- الحفاظ على WhatsApp والنسخ الاحتياطي والحماية.\n- إضافة فحص التحديثات من داخل التطبيق.\n- Android 9 وما بعده." \
            --latest
      - name: Add APK to workflow summary
        run: |
          echo "## Saber Electronics APK" >> "$GITHUB_STEP_SUMMARY"
          echo "تم نشر APK في GitHub Releases العامة." >> "$GITHUB_STEP_SUMMARY"
